server {
    listen 80;
    server_name localhost;

    # 1. API GraphQL
    location /api/ {
        proxy_pass http://wren-engine:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 2. UI protegida (produção)
    location ~ ^/(home|_next|images|assets|favicon\.png) {
        # Para teste, pode comentar a linha abaixo para não exigir login
        # auth_request /auth/verify;
        # error_page 401 =302 http://$host/;

        proxy_pass http://wren-ui:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. UI em modo teste / anon
    location /anon/ {
        rewrite ^/anon(/.*)$ $1 break;
        proxy_pass http://wren-ui:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 4. Auth (catch-all)
    location / {
        proxy_pass http://wren-auth:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 5. Auth internal endpoint
    location = /auth/verify {
       return 200;
    }

    # 6. Healthcheck interno do Nginx
    location = /healthcheck {
        default_type application/json;
        return 200 '{"status":"ok","service":"wren-auth","ts":0}';
    }

}