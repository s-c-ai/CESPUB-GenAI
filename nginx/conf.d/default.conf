server {
    listen 80;
    server_name localhost;

    # 1. Rota interna para verificação de autenticação.
    # Só o Nginx pode chamar isso.
    location = /auth/verify {
        internal;
        proxy_pass http://wren-auth:5173;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    # 2. Rota para a API GraphQL.
    # Deve ser processada ANTES das rotas da UI.
    # Não precisa de auth_request aqui, pois a UI só faz a chamada se já estiver carregada (e autenticada).
    location /api/ {
        proxy_pass http://wren-engine:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Linha crucial para APIs que recebem JSON
        proxy_set_header Content-Type $http_content_type;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. Rotas protegidas da UI (wren-ui).
    # Acessadas somente após autenticação.
    location ~ ^/(home|_next|images|assets|favicon\.png) {
        auth_request /auth/verify;
        # Se auth_request retornar 401, redireciona para a raiz (que é o wren-auth).
        error_page 401 =302 http://$host/;

        proxy_pass http://wren-ui:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 4. Rota "catch-all" para o serviço de autenticação (wren-auth).
    # Qualquer outra requisição (como a raiz "/") vai para a página de login.
    location / {
        proxy_pass http://wren-auth:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}